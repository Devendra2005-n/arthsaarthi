name: Fetch Indian Financial Data

on:
  schedule:
    - cron: '0 16 * * *'  # 9:30 PM IST daily
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fetch AMFI NAV data
        run: python scripts/fetch_amfi.py
      - name: Fetch Gold Rates
        run: python scripts/fetch_gold.py
